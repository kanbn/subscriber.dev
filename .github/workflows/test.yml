name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-

      - name: Run unit tests
        run: pnpm turbo run test

      - name: Check the OpenAPI spec, clients and SDK are up to date
        run: |
          pnpm turbo run openapi --filter=@subscriber.dev/api
          pnpm --filter @subscriber.dev/api-client generate
          pnpm --filter @subscriber.dev/sdk generate
          git diff --exit-code -- apps/api/openapi.json apps/docs/openapi.json packages/api-client/src packages/sdk/src/generated || {
            echo "::error::The OpenAPI spec or generated clients are out of date. Run: pnpm --filter @subscriber.dev/api openapi && pnpm --filter @subscriber.dev/api-client generate && pnpm --filter @subscriber.dev/sdk generate"
            exit 1
          }
