name: Publish CLI

on:
  push:
    branches: [main]
    paths:
      - apps/cli/**
      - packages/api-client/**
      - packages/shared/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the version is new
        id: version
        working-directory: apps/cli
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@subscriber.dev/cli@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm, nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish
        run: pnpm install --frozen-lockfile

      - name: Test and build
        if: steps.version.outputs.publish
        run: pnpm turbo run test build --filter=@subscriber.dev/cli

      - name: Publish
        if: steps.version.outputs.publish
        working-directory: apps/cli
        run: |
          pnpm pack
          npm publish subscriber.dev-cli-*.tgz --provenance --access public
