name: Publish packages

on:
  push:
    branches: [main]
    paths:
      - apps/cli/**
      - packages/api-client/**
      - packages/shared/**
      - packages/sdk/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        package:
          - { dir: apps/cli, name: "@subscriber.dev/cli" }
          - { dir: packages/sdk, name: "@subscriber.dev/sdk" }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the version is new
        id: version
        working-directory: ${{ matrix.package.dir }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "${{ matrix.package.name }}@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm, nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish
        run: pnpm install --frozen-lockfile

      - name: Test and build
        if: steps.version.outputs.publish
        run: pnpm turbo run test build --filter=${{ matrix.package.name }}

      - name: Publish
        if: steps.version.outputs.publish
        working-directory: ${{ matrix.package.dir }}
        run: |
          pnpm pack
          npm publish ./*.tgz
