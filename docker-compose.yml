services:
  web:
    image: ghcr.io/kanbn/subscriber.dev:latest
    container_name: ${CONTAINER_NAME:-sub-web}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - subscriber-network
      - dokploy-network
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    env_file:
      - .env
    environment:
      # Required environment variables
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - POSTGRES_URL=${POSTGRES_URL}

      # SMTP (optional)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - SMTP_REJECT_UNAUTHORIZED=${SMTP_REJECT_UNAUTHORIZED}

      # GitHub sign-in (optional)
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    depends_on:
      - postgres
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: sub-api
    ports:
      - "${API_PORT:-3001}:3001"
    networks:
      - subscriber-network
    env_file:
      - .env
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - PORT=3001
      - CORS_ORIGIN=${NEXT_PUBLIC_BASE_URL}
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORT/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: sub-db
    environment:
      - POSTGRES_DB=subscriber_db
      - POSTGRES_USER=subscriber
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - sub_postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - subscriber-network

  redis:
    image: redis:7-alpine
    container_name: sub-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - sub_redis_data:/data
    restart: unless-stopped
    networks:
      - subscriber-network

networks:
  subscriber-network:
  dokploy-network:
    external: true

volumes:
  sub_postgres_data:
  sub_redis_data:
