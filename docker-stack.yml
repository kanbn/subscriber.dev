# Production stack for Docker Swarm. Self-hosters: use docker-compose.yml.
services:
  web:
    image: ghcr.io/kanbn/subscriber.dev/web:latest
    env_file:
      - .env
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/robots.txt"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any

  api:
    image: ghcr.io/kanbn/subscriber.dev/api:latest
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - PORT=3001
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORT/health"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any

  postgres:
    image: postgres:18
    env_file:
      - .env
    environment:
      - POSTGRES_DB=subscriber_db
      - POSTGRES_USER=subscriber
    volumes:
      - sub_postgres_data:/var/lib/postgresql
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:?}
        mode: host
    networks:
      - internal
    deploy:
      restart_policy:
        condition: any

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - sub_redis_data:/data
    networks:
      - internal
    deploy:
      restart_policy:
        condition: any

networks:
  internal:

volumes:
  sub_postgres_data:
  sub_redis_data:
