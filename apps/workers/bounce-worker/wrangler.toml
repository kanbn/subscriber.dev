name = "subscriber-bounce-worker"
main = "src/index.ts"
compatibility_date = "2026-08-18"

[vars]
# Base URL of the subscriber.dev API this worker reports bounces to.
BOUNCE_WEBHOOK_URL = "https://api.subscriber.dev"

# BOUNCE_WEBHOOK_SECRET is NOT set here - it's a secret, set via:
#   wrangler secret put BOUNCE_WEBHOOK_SECRET
# It must match the API's BOUNCE_WEBHOOK_SECRET environment variable exactly.
# For local `wrangler dev`, put it in a .dev.vars file instead (gitignored).
