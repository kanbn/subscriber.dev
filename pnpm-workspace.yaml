packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@tanstack/react-query": ^5.104.1
  eslint: ^9.39.5
  prettier: ^3.9.9
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  zod: ^4.6.5

catalogs:
  react19:
    react: ^19.3.0
    react-dom: ^19.3.0
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0

nodeLinker: hoisted
linkWorkspacePackages: true
shamefullyHoist: true

overrides:
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/minimatch": "npm:minimatch@*"
  "@types/glob": "npm:@types/glob@^8.1.0"
  prosemirror-model: ^1.25.12
  next: ^16.4.3

allowBuilds:
  "@scarf/scarf": false
  "@swc/core": true
  core-js: false
  esbuild: true
  keytar: true
  msgpackr-extract: true
  sharp: true
patchedDependencies:
  nestjs-zod@5.5.0: patches/nestjs-zod@5.5.0.patch
